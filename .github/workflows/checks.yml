name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: server/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=120s ./...
  package-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s client/tests -p test_build.py -v
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror client/tests/descriptor_host.cpp -o "$RUNNER_TEMP/descriptor-host"
      - run: '"$RUNNER_TEMP/descriptor-host"'
  native-client:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify compiler archive and test native client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Get-Content client/toolchain.lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $toolchain.archive
          Invoke-WebRequest -Uri $toolchain.url -OutFile $archive -TimeoutSec 180
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $toolchain.sha256) { throw 'Compiler archive SHA256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $compiler = Join-Path (Join-Path $env:RUNNER_TEMP $toolchain.directory) 'bin/x86_64-w64-mingw32-clang++.exe'
          $openssl = 'C:/Program Files/Git/usr/bin/openssl.exe'
          if (!(Test-Path -LiteralPath $openssl)) { throw 'Owned TLS tests require OpenSSL' }
          python -X utf8 -B client/tests/run_images.py --compiler $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B client/tests/run_owned.py --compiler $compiler --openssl $openssl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B client/build.py --compiler $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
