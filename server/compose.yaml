services:
  wwe2k22:
    image: ghcr.io/replace-me/wwe2k22-server-client:2026.10.28-server.3
    restart: unless-stopped
    environment:
      WWE_DEPLOYMENT: public
      WWE_PUBLIC_ADDRESS: "203.0.113.10"        # IP pubblico oppure dominio del VPS
      WWE_ADVERTISE_UDP_PORT: "8788"            # Stessa porta UDP esposta sotto
      WWE_ACME_ACCEPT_TERMS: "false"            # true dopo aver accettato i termini Let's Encrypt
    ports:
      - "443:8787/tcp"                          # HTTPS: mantieni 443 con il certificato automatico
      - "8788:8788/udp"                         # Porta esterna:porta interna; cambia solo la prima
    volumes: ["state:/data"]
volumes:
  state:
