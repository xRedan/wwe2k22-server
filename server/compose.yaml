services:
  wwe2k22:
    image: ghcr.io/replace-me/wwe2k22-server-client:2026.10.28-server.3
    restart: unless-stopped
    environment:
      WWE_DEPLOYMENT: public
      WWE_PUBLIC_ADDRESS: "203.0.113.10"        # Public VPS IPv4 address or domain name
      WWE_ADVERTISE_UDP_PORT: "8788"            # Must match the external UDP port published below
      WWE_ACME_ACCEPT_TERMS: "false"            # Set to true after accepting Let's Encrypt's terms
    ports:
      - "443:8787/tcp"                          # HTTPS: keep public port 443 for automatic certificates
      - "8788:8788/udp"                         # External:internal port; change only the external port
    volumes: ["state:/data"]
volumes:
  state:
